server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Si le fichier existe, le servir, sinon rediriger vers index.html
        try_files $uri /index.html;
    }

    # Optionnel : désactiver la log des erreurs 404 pour les routes SPA
    location = /404.html {
        internal;
    }
}
